name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:
    workflow_dispatch:

jobs:
    # One portable abi3 wheel per platform (cp310-abi3: CPython 3.10+)
    build:
        name: Build wheel (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.16.0

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install PyOZ
              run: python -m pip install "pyoz>=0.13.7"

            - name: Build wheel
              run: pyoz build --release

            - name: Check the extension really uses the Stable ABI
              if: runner.os == 'Linux'
              run: |
                  unzip -o -q dist/*.whl zrules.so -d /tmp/whl
                  nm -D /tmp/whl/zrules.so | grep -q " U PyType_FromSpec" || { echo "not an abi3 build"; exit 1; }

            - uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ runner.os }}
                  path: dist/*.whl
                  if-no-files-found: error

    test:
        name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
        needs: build
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.10", "3.12", "3.14"]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - uses: actions/download-artifact@v4
              with:
                  name: wheel-${{ runner.os }}
                  path: dist

            - name: Install zgram
              run: python -m pip install "zgram-py>=0.2.1"

            - name: Install wheel
              shell: bash
              run: python -m pip install --no-deps dist/*.whl && python -m pip install pytest pytest-timeout

            # Real Lua code for the examples/lua test (it is skipped without)
            - name: Install a Lua corpus
              if: runner.os == 'Linux'
              run: sudo apt-get update -q && sudo apt-get install -y -q nmap

            - name: Run tests
              timeout-minutes: 10
              run: python -m pytest test -v -o faulthandler_timeout=120 --timeout=300
