[build-system]
requires = ["pyoz>=0.13.10"]
build-backend = "pyoz.backend"

[project]
# zsuite packages are named <name>-py on PyPI; the import name stays `zrules` (module-name below)
name = "zrules-py"
version = "0.2.0"
description = "Static semantics for languages parsed with zgram: structural rules, scopes and symbol tables, types, control flow, native and fast."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniele Linguaglossa" }]
keywords = ["linter", "static-analysis", "parser", "dsl", "language", "zgram"]
dependencies = ["zgram-py>=0.3.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dzonerzy/zrules"
Source = "https://github.com/dzonerzy/zrules"
Issues = "https://github.com/dzonerzy/zrules/issues"
Changelog = "https://github.com/dzonerzy/zrules/blob/main/CHANGELOG.md"

[tool.pyoz]
# Path to your Zig source file
module-path = "src/lib.zig"

# Python import name (the distribution is zrules-py)
module-name = "zrules"

# Strip debug symbols in release builds
strip = true

# One wheel per platform for CPython 3.10+ (stable ABI)
abi3 = true
