[build-system]
requires = ["pyoz>=0.13.7"]
build-backend = "pyoz.backend"

[project]
name = "zrules"
version = "0.1.0"
description = "Static rules over zgram parse trees: selectors, context and uniqueness rules, diagnostics."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniele Linguaglossa" }]
keywords = ["linter", "static-analysis", "parser", "dsl", "language", "zgram"]
dependencies = ["zgram-py>=0.2.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dzonerzy/zrules"
Source = "https://github.com/dzonerzy/zrules"
Issues = "https://github.com/dzonerzy/zrules/issues"
Changelog = "https://github.com/dzonerzy/zrules/blob/main/CHANGELOG.md"

[tool.pyoz]
# Path to your Zig source file
module-path = "src/lib.zig"

# Strip debug symbols in release builds
strip = true

# One wheel per platform for CPython 3.10+ (stable ABI)
abi3 = true
