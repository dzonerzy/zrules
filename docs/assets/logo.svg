<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: the zsuite tile -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Zig orange: the zsuite Z -->
    <linearGradient id="zig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7a41d"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- zrules' own accent: emerald, for what passes -->
    <linearGradient id="pass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <!-- A diagnostic's red, for what doesn't -->
    <linearGradient id="fail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="glowOut"/>
      <feMerge>
        <feMergeNode in="glowOut"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- The shield: rules guarding a program -->
  <path d="M 256 88 L 412 136 L 412 256 C 412 340 348 392 256 428 C 164 392 100 340 100 256 L 100 136 Z"
        fill="url(#pass)" fill-opacity="0.06"
        stroke="url(#pass)" stroke-width="5" stroke-linejoin="round" stroke-opacity="0.55"
        filter="url(#glow)"/>

  <!-- Editor gutter on the left: lines of code, checked -->
  <g stroke-linecap="round">
    <!-- code lines -->
    <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="4">
      <line x1="40" y1="166" x2="78" y2="166"/>
      <line x1="40" y1="198" x2="70" y2="198"/>
      <line x1="40" y1="230" x2="82" y2="230"/>
    </g>
    <!-- markers: pass, pass, fail -->
    <g fill="none" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
      <polyline points="24,166 28,170 35,161" stroke="url(#pass)"/>
      <polyline points="24,198 28,202 35,193" stroke="url(#pass)"/>
      <g stroke="url(#fail)">
        <line x1="24" y1="225" x2="34" y2="235"/>
        <line x1="34" y1="225" x2="24" y2="235"/>
      </g>
    </g>
  </g>

  <!-- Main "Z" letterform: the zsuite mark -->
  <g filter="url(#outerGlow)">
    <path d="
      M 150 168
      L 362 168
      L 362 197
      L 220 321
      L 362 321
      L 362 350
      L 150 350
      L 150 321
      L 292 197
      L 150 197
      Z
    " fill="url(#zig)"/>
  </g>

  <!-- A diagnostic underline beneath it -->
  <path d="M 196 374 q 7 -8 14 0 t 14 0 t 14 0 t 14 0 t 14 0 t 14 0 t 14 0 t 14 0 t 14 0"
        fill="none" stroke="url(#fail)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" opacity="0.9"/>

  <!-- "rules" text -->
  <text x="256" y="474" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
        font-size="58" font-weight="700" letter-spacing="8"
        fill="url(#pass)">rules</text>

  <!-- A rule, as a watermark -->
  <text x="256" y="58" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="11" fill="#ffffff" opacity="0.14"
        letter-spacing="1">inside("Break", within="While")</text>
</svg>
